services:
  - type: web
    name: dose-certa-api
    env: docker
    rootDir: "Dose Certa Spring"
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: PGHOST
        fromDatabase:
          name: dose-certa-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: dose-certa-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: dose-certa-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: dose-certa-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: dose-certa-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://dose-certa-bay.vercel.app
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_LOGIN
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: dose-certa-db
    plan: free
