services:
  - type: web
    name: dose-certa-api
    env: docker
    rootDir: "Dose Certa Spring"
    plan: free
    healthCheckPath: /health/ready
    envVars:
      # Copy these values from Supabase > Connect > Session Pooler.
      # Keep all credentials private and configure them in Render, never in Git.
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://dose-certa-bay.vercel.app
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_LOGIN
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
