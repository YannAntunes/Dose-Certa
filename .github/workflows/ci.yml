name: Dose Certa CI
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        working-directory: Doce Certa Front-End
      - run: npm test
        working-directory: Doce Certa Front-End
      - run: npm run build
        working-directory: Doce Certa Front-End
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash ./mvnw -B -ntp test '-Dspring.profiles.active=test'
        working-directory: Dose Certa Spring
