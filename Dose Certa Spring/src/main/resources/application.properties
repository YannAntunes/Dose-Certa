# ===============================
# BANCO DE DADOS - POSTGRES
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dose_certa}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2019}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# TIMEZONE
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}

# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:uma-chave-muito-grande-com-mais-de-32-caracteres-123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# MODULO DE EXAMES (analise assistida)
# ===============================
# Armazenamento local dos PDFs (fora de diretorios publicos). Em producao use um volume persistente.
exam.storage.dir=${EXAMS_STORAGE_DIR:./data/exams}
exam.upload.max-bytes=10485760
exam.upload.max-pages=200
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Gemini: a chave NUNCA deve ser versionada. Sem GEMINI_API_KEY a analise por IA fica desabilitada (HTTP 503).
exam.gemini.api-key=${GEMINI_API_KEY:}
exam.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
exam.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
exam.gemini.connect-timeout-ms=5000
exam.gemini.read-timeout-ms=60000
