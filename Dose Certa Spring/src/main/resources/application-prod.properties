# Configurações do Banco de Dados PostgreSQL (Produção - Render)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=prefer&prepareThreshold=0&connectTimeout=10&socketTimeout=30
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver correto para Produção
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# Configurações do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production JWT secret (usa JWT_SECRET do ambiente no Render com fallback seguro de 32+ bytes para evitar falha de boot)
jwt.secret=${JWT_SECRET:uma-chave-muito-grande-com-mais-de-32-caracteres-123456}
jwt.expiration=${JWT_EXPIRATION:86400000}
