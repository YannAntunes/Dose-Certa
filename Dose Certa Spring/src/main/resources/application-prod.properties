# Configurações do Banco de Dados PostgreSQL (Produção - Render + Supabase Session Pooler)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=require&prepareThreshold=0&connectTimeout=10&socketTimeout=30
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Otimização do HikariCP para Cold Start no Render e limites do Pooler do Supabase
spring.datasource.hikari.pool-name=DoseCertaProdPool
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Configurações do Hibernate/JPA (open-in-view desabilitado para não reter conexões HTTP)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Evita operações desnecessárias no banco durante cada cold start em produção
app.seed.medicamentos-enabled=${APP_SEED_MEDICAMENTOS_ENABLED:false}
app.db.migrate-on-startup=${APP_DB_MIGRATE_ON_STARTUP:false}

# Segredo JWT obrigatório injetado pelo ambiente em produção (sem fallback inseguro)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
