# Perfil de teste: banco H2 em memoria (modo PostgreSQL), sem dependencias externas.
spring.datasource.url=jdbc:h2:mem:examtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
exam.storage.dir=${java.io.tmpdir}/dosecerta-test-exams
exam.gemini.api-key=fake-key-for-tests-only
